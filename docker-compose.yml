version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # 1. BANCO DE DADOS RELACIONAL (POSTGRESQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gfb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gfb_growth_os}
      POSTGRES_USER: ${POSTGRES_USER:-gfb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gfb_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfb_user} -d ${POSTGRES_DB:-gfb_growth_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gfb-network

  # ----------------------------------------------------------------------------
  # 2. FILAS DISTRIBUÍDAS & CACHE (REDIS 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gfb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-gfb_redis_secure_pass}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gfb_redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gfb-network

  # ----------------------------------------------------------------------------
  # 3. OBJECT STORAGE S3 PARA VÍDEOS & ÁUDIOS (MINIO)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: gfb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gfb_storage_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gfb_minio_secret_key_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - gfb-network

  # ----------------------------------------------------------------------------
  # 4. BACKEND CORE (NODE.JS + PRISMA + BULLMQ)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gfb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gfb_user}:${POSTGRES_PASSWORD:-gfb_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-gfb_growth_os}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gfb_redis_secure_pass}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-gfb_master_jwt_secret_key_32_bytes_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-gfb_master_jwt_refresh_secret_32_bytes}
      COOKIE_SECRET: ${COOKIE_SECRET:-gfb_cookie_secret_16_bytes_long}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_LOCAL_PATH: /app/data/uploads
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/data/uploads
    networks:
      - gfb-network

  # ----------------------------------------------------------------------------
  # 5. FRONTEND SPA (VITE + REACT + NGINX)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gfb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - gfb-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  backend_uploads:
    driver: local

networks:
  gfb-network:
    driver: bridge
